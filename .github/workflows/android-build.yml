name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  GODOT_VERSION: 4.3

jobs:
  export-android:
    name: Export debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot export templates and Android toolchain
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Make export dir
        run: mkdir -v -p build/android

      - name: Export Android debug APK
        run: godot --headless --verbose --export-debug "Android" build/android/catbox.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: catbox-debug-apk
          path: build/android/catbox.apk
          if-no-files-found: error
