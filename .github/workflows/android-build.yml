name: Android Build

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

env:
  GODOT_VERSION: 4.3

jobs:
  export-android:
    name: Export debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot export templates and Android toolchain
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # Экспорт НЕ падает на ошибках разбора GDScript — он просто кладёт
      # битый скрипт в APK, и ломается это уже на телефоне (так уехали
      # "Theme shadows a native class" и "cannot infer type of shelf_top":
      # в обоих случаях скрипт не грузился, уровень не расставлялся).
      # Поэтому сначала прогоняем импорт проекта в редакторе и падаем,
      # если в выводе есть ошибки скриптов.
      - name: Validate GDScript (fail on parse errors)
        shell: bash
        run: |
          godot --headless --editor --quit-after 200 > /tmp/import.log 2>&1 || true
          echo "---- import log (tail) ----"
          tail -n 40 /tmp/import.log || true
          echo "---------------------------"
          # Ошибки печатаем через ::error::, чтобы они попадали в аннотации
          # GitHub: аннотации отдаются публичным API, в отличие от логов.
          if grep -nE "SCRIPT ERROR|Parse Error|Failed to load script" /tmp/import.log > /tmp/errs.txt 2>/dev/null; then
            while IFS= read -r line; do echo "::error::$line"; done < /tmp/errs.txt
            exit 1
          fi
          echo "GDScript import clean."

      - name: Make export dir
        run: mkdir -v -p build/android

      - name: Export Android debug APK
        run: godot --headless --verbose --export-debug "Android" build/android/catbox.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: catbox-debug-apk
          path: build/android/catbox.apk
          if-no-files-found: error
